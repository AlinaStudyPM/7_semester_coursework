[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-app"
version = "2026.04"
requires-python = ">=3.10"
description = "Локальное RAG приложение"
readme = "README.md"
authors = [{name = "Алина Комарова", email="alina.studyandbooks@gmail.com"}]

dependencies = [
    "flet>=0.80.0, <0.85.0",
    "chromadb>=1.0.0,<1.6.0",
    "ollama>=0.4.0,<0.7.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "requests>=2.33.0,<2.34.0",
    "pdfplumber>=0.11.0,<0.12.0",
    "pdf2image>=1.17.0,<2.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "bcrypt>=4.0.0,<6.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "fastembed>=0.7.4,<0.8.0",
    "odfdo>=3.7,<4.0", 
    "markitdown[docx,pptx]>=0.0.1a1,<1.0",
    "charset-normalizer>=3.4.0, <4.0.0"
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.26.0, <1.27.0",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "fastembed-gpu",
]

dev = [
    "pytest==9.0.2",
    "ruff>=0.4.0,<1.0.0",
    "pytest-asyncio>=0.25.0",
]
eval = [
    "ragas>=0.4.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "openrouter>=0.2.0",
]

[project.scripts]
rag-cli = "src.entrypoints.cli:main"
rag-web = "src.entrypoints.web:main"  
rag-desktop = "src.entrypoints.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
src = ["src", "tests", "benchmarks"]
exclude = [
    ".git",
    "__pycache__",
    "data",
    "logs",
    "docs",
    "config",
    "upload",
    "tests",
]
include = [
    "src/ChatAgent.py", "src/ChatHistory.py", "src/ChromaAdapter.py",
    "src/Config.py", "src/CoreApp.py", "src/DocumentProcessor.py",
    "src/entrypoints/desktop.py", "src/entrypoints/web.py",
    "src/FileUploader.py", "src/FletUI.py", "src/LoginView.py",
    "src/MainView.py", "src/RAGApp.py", "src/UserManager.py",
    "benchmarks/benchmark_utils.py", "benchmarks/config_generation.py",
    "benchmarks/config_rerank.py", "benchmarks/config_retrieval.py",
    "benchmarks/dataset.py", "benchmarks/embeddings.py",
    "benchmarks/eval_generation_dragon.py", "benchmarks/eval_rerank_dragon.py",
    "benchmarks/eval_retrieval_dragon.py", "benchmarks/judge.py",
    "benchmarks/metrics.py", "benchmarks/rag_pipeline.py",
    "benchmarks/result_utils.py", "benchmarks/short_eval_rerank_dragon.py",
    "benchmarks/short_eval_retrieval_dragon.py"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "E501", "F841"]
"benchmarks/**/*.py" = ["E501", "F401", "SIM102"]
